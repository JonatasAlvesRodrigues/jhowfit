    </style>
  </head>
  <body><main><img src="./icon-192.png" alt="MOVELYA" /><h1>Você está offline</h1><p>O MOVELYA não armazenou seus dados pessoais neste dispositivo. Conecte-se novamente para acessar sua conta com segurança.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
